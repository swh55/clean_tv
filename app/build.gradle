plugins {
    id 'com.android.application'
}

android {
    namespace 'pro.datascoop.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'pro.datascoop.tv'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Offline prayer-time calculation (no network, no transitive dependencies).
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
    // Unit tests for the pure layers (prayer times, weather parsing, interface strings, tokens).
    testImplementation 'junit:junit:4.13.2'
    // The real org.json on the test classpath: android.jar only stubs it.
    testImplementation 'org.json:json:20240303'
}
