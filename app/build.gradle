plugins {
    id 'com.android.application'
}

android {
    namespace 'pro.datascoop.afnon'
    compileSdk 34

    defaultConfig {
        applicationId 'pro.datascoop.afnon'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Offline prayer-time calculation (no network, no transitive dependencies).
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
}
