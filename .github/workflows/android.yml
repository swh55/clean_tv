# Builds Afnon's debug APK: on every push to main and every pull request (as a downloadable artifact),
# and on a v* tag, where the APK is also attached to that tag's release. The adhan recordings are not in
# the repo (no licence): fetch-adhans.sh downloads them first. The spoken reminder clips need edge-tts and
# are made when they can be; without them everything else still builds and runs.
name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          # ubuntu-latest ships the SDK; make sure platform 34 and its build-tools are there.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Adhan recordings
        run: bash tools/fetch-adhans.sh

      - name: Spoken reminder clips (best effort)
        run: |
          pip install edge-tts || true
          bash tools/fetch-announce.sh || true

      - name: Unit tests (prayer times, weather, text, tokens)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: APK → artifact
        uses: actions/upload-artifact@v4
        with:
          name: afnon-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The download links (README, the Arabic install guide, the site) point at
      # releases/latest/download/scoop-tv.apk, so the release asset carries that name on every tag.
      - name: APK → release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk scoop-tv.apk
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: scoop-tv.apk
          fail_on_unmatched_files: true
